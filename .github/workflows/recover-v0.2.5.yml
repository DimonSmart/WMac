# One-time recovery of the missing release; remove after publication.
name: Recover WMac v0.2.5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-v0.2.5.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    uses: ./.github/workflows/release.yml
    with:
      release_tag: v0.2.5
