name: Validate WMac

on:
  push:
    branches: [main]
    paths:
      - 'Sources/Core/**'
      - 'Sources/Watchdog/**'
      - 'Sources/WMac/**'
      - 'Sources/Core/Settings.swift'
      - 'WMac.xcodeproj/**'
      - 'scripts/**'
      - 'Tests/**'
      - '.github/workflows/dock-build.yml'
  workflow_dispatch:

jobs:
  compile:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build WMac and embedded watchdog
        run: |
          xcodebuild -project WMac.xcodeproj -target WMac -configuration Debug SYMROOT="$RUNNER_TEMP/WMacProducts" OBJROOT="$RUNNER_TEMP/WMacObjects" CODE_SIGNING_ALLOWED=NO build
      - name: Run model checks (without modifying Dock)
        run: |
          mkdir -p .build/tests
          xcrun swiftc -swift-version 6 -o .build/tests/ModelTests Sources/Core/*.swift Tests/*.swift
          .build/tests/ModelTests
      - name: Verify signed universal release DMG and embedded helper
        run: ./scripts/release.sh 0.1.0 1
